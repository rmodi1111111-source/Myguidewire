<title>Cyber Clearance Event Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a teaching stage. One hop at a time fills a large scene in the centre; the chapter list sits left, the "under the hood" panel right, a live narration caption under the scene. Other views (architecture, Kafka cluster, data, technology guide) are tabs. Built for 1920–2560px monitors; stacks on narrow screens. */
:root{
  --bg:#e8ecf1; --panel:#ffffff; --panel-2:#f3f5f8; --sunk:#edf0f4;
  --ink:#122033; --muted:#526174; --faint:#8794a5; --line:#cdd5df; --grid:#e1e6ec;
  --accent:#1f4fbf; --accent-ink:#ffffff; --accent-soft:rgba(31,79,191,.10);
  --zone:#f6f8fa; --zone-kafka:#fff5ec; --zone-vnet:#f0f5fc; --zone-sub:#ffffff;
  --c-kafka:#c2410c; --c-sb:#0369a1; --c-http:#0f766e; --c-pg:#4338ca; --c-es:#a16207;
  --c-sr:#be185d; --c-cdc:#b91c1c; --c-snow:#0e7490; --c-logic:#475569; --c-ext:#334155;
  --good:#15803d; --warn:#b45309; --bad:#b91c1c;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b121b; --panel:#111b27; --panel-2:#16222f; --sunk:#0e1722;
  --ink:#e3eaf2; --muted:#9aaabb; --faint:#6a7b8f; --line:#28384c; --grid:#1b2837;
  --accent:#7aa2ff; --accent-ink:#0b121b; --accent-soft:rgba(122,162,255,.15);
  --zone:#0f1924; --zone-kafka:#1b140d; --zone-vnet:#0e1825; --zone-sub:#111c29;
  --c-kafka:#fb923c; --c-sb:#38bdf8; --c-http:#2dd4bf; --c-pg:#a5b4fc; --c-es:#facc15;
  --c-sr:#f472b6; --c-cdc:#f87171; --c-snow:#67e8f9; --c-logic:#a3b1c2; --c-ext:#cbd5e1;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b121b; --panel:#111b27; --panel-2:#16222f; --sunk:#0e1722;
  --ink:#e3eaf2; --muted:#9aaabb; --faint:#6a7b8f; --line:#28384c; --grid:#1b2837;
  --accent:#7aa2ff; --accent-ink:#0b121b; --accent-soft:rgba(122,162,255,.15);
  --zone:#0f1924; --zone-kafka:#1b140d; --zone-vnet:#0e1825; --zone-sub:#111c29;
  --c-kafka:#fb923c; --c-sb:#38bdf8; --c-http:#2dd4bf; --c-pg:#a5b4fc; --c-es:#facc15;
  --c-sr:#f472b6; --c-cdc:#f87171; --c-snow:#67e8f9; --c-logic:#a3b1c2; --c-ext:#cbd5e1;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono)}
.shell{display:flex;flex-direction:column;gap:12px;min-height:100%}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand h1{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
nav.views{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
nav.views button{border:0;background:none;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
nav.views button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:10px 18px;font-size:15px}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;min-height:0}
.view[hidden]{display:none!important}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--panel-2);white-space:nowrap}
.chip b{font-weight:600}
.chip.ok{border-color:color-mix(in srgb,var(--good) 45%,transparent);color:var(--good)}
.chip.no{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.sec{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;padding:14px 0}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:12px;line-height:1.55;overflow:auto;max-height:440px;white-space:pre}
.jk{color:var(--c-pg)} .js{color:var(--c-http)} .jn{color:var(--c-kafka)} .jl{color:var(--c-sr)}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv th{text-align:left;font-weight:500;color:var(--muted);padding:5px 12px 5px 0;vertical-align:top;white-space:nowrap;width:1%}
.kv td{padding:5px 0;font-family:var(--f-mono);font-size:12.5px;word-break:break-word}
.kv tr+tr th,.kv tr+tr td{border-top:1px solid var(--grid)}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:9px 12px;border-radius:0 8px 8px 0;font-size:14px}
.note.teach{border-left-color:var(--accent);background:var(--accent-soft)}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}

/* ---------- guided lab ---------- */
.subbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px}
.subbar .who{font-family:var(--f-display);font-size:19px;font-weight:600}
.subbar .ids{display:flex;flex-wrap:wrap;gap:6px}
.guided{display:grid;gap:12px;grid-template-columns:270px minmax(0,1fr) 440px;align-items:start}
.chapters{padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.chapters h2{font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:4px 6px 8px}
.chap{border-radius:8px;margin-bottom:4px}
.chap > button{width:100%;text-align:left;border:0;background:none;padding:8px 8px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.chap > button:hover{background:var(--panel-2)}
.chap .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.chap.done .n{background:var(--good);border-color:var(--good);color:#fff}
.chap.cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chap .t{font-weight:600;font-size:14px;line-height:1.25}
.chap .c{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.chap ol{list-style:none;margin:0 0 6px 36px;padding:0;display:none}
.chap.cur ol{display:block}
.chap li button{border:0;background:none;text-align:left;width:100%;padding:3px 6px;border-radius:6px;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;gap:6px}
.chap li button:hover{background:var(--panel-2)}
.chap li button.cur{color:var(--ink);background:var(--accent-soft);font-weight:600}
.chap li button.done{color:var(--ink)}
.chap li .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}

.stage{display:flex;flex-direction:column;min-width:0}
.stagehead{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start}
.stagehead .eyebrow{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stagehead h2{font-size:30px;font-weight:700;line-height:1.15;margin-top:4px}
.stagehead .route{margin-top:8px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chan{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 8px;color:#fff;text-transform:uppercase;letter-spacing:.04em}
.minimap{border:1px solid var(--line);border-radius:8px;background:var(--zone);cursor:pointer}
.minimap svg{width:100%;height:auto;display:block}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.controls .ctr{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls label{display:flex;flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.controls select{max-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px}
.controls input[type=range]{width:90px}
.progress{height:4px;background:var(--grid)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.scene{padding:18px;min-height:540px;position:relative}
.caption{border-top:1px solid var(--line);padding:16px 20px 18px;background:var(--panel-2);border-radius:0 0 12px 12px}
.caption .lbl{display:flex;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:6px}
.caption .lbl .live{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.caption .lbl .live.on{background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.caption p{margin:0;font-size:18px;line-height:1.6;max-width:120ch}
.caption p span.s{transition:background .2s,color .2s;border-radius:4px}
.caption p span.s.now{background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.caption p span.s.past{color:var(--muted)}

.detail{padding:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.detail .dh{padding:14px 16px;border-bottom:1px solid var(--line)}
.detail .dh h3{font-size:18px}
.detail .db{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.deep{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.deep li::marker{color:var(--accent)}
.deep code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* ---------- scene building blocks ---------- */
.flow{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(220px,300px);gap:18px;align-items:stretch}
.ccard{border:1.5px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.ccard::before{content:"";position:absolute;left:-1.5px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--k,var(--line))}
.ccard.act{border-color:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 18%,transparent)}
.ccard.dim{opacity:.6}
.ccard h4{font-size:17px;font-weight:600;display:flex;flex-direction:column}
.ccard h4 small{font-family:var(--f-mono);font-size:11.5px;font-weight:400;color:var(--muted)}
.ccard dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 10px;margin:0;font-size:12.5px}
.ccard dt{color:var(--muted)}
.ccard dd{margin:0;font-family:var(--f-mono);font-size:12px;word-break:break-word}
.ccard .role{font-size:13px;color:var(--muted)}
.mid{display:flex;flex-direction:column;gap:12px;min-width:0}
.medium{border:1.5px dashed color-mix(in srgb,var(--k) 55%,var(--line));border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--k) 5%,var(--panel));flex:1;min-width:0}
.medium h5{margin:0 0 8px;font-family:var(--f-display);font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.medium h5 small{font-family:var(--f-mono);font-weight:400;font-size:11.5px;color:var(--muted)}
.wire{position:relative;height:34px;border-radius:17px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--k) 30%,transparent) 0 8px,transparent 8px 16px);background-size:100% 3px;background-repeat:no-repeat;background-position:0 50%}
.env{position:absolute;top:2px;left:0;height:30px;padding:0 12px;border-radius:15px;background:var(--k);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:600;display:flex;align-items:center;white-space:nowrap;animation:travel var(--dur,2.4s) ease-in-out forwards}
.env.rev{animation-name:travelback}
@keyframes travel{from{left:0;transform:translateX(0)}to{left:100%;transform:translateX(-100%)}}
@keyframes travelback{from{left:100%;transform:translateX(-100%)}to{left:0;transform:translateX(0)}}
.stages{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;counter-reset:stg}
.stg{flex:1 1 160px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--panel);opacity:.45;transition:opacity .3s,border-color .3s,background .3s;counter-increment:stg;min-width:0}
.stg b{display:block;font-size:13px;font-weight:600}
.stg b::before{content:counter(stg) " · ";color:var(--muted);font-family:var(--f-mono);font-weight:500}
.stg span{color:var(--muted);font-size:12.5px}
.stg.on{opacity:1;border-color:var(--k,var(--accent));background:color-mix(in srgb,var(--k,var(--accent)) 8%,var(--panel))}
.stg.on b::after{content:" ✓";color:var(--good)}

/* kafka */
.kscene{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;gap:16px;align-items:start;--k:var(--c-kafka)}
.topicbox{border:1.5px solid color-mix(in srgb,var(--c-kafka) 55%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--c-kafka) 4%,var(--panel));padding:12px 14px;min-width:0}
.topicbox h5{margin:0;font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--c-kafka)}
.topicbox .tcfg{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin:3px 0 10px}
.lane{display:grid;grid-template-columns:44px 132px minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--grid)}
.lane.hot{background:color-mix(in srgb,var(--c-kafka) 9%,transparent);border-radius:8px}
.lane .pl{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:center}
.lane .ldr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:1.3}
.cells{display:flex;gap:3px;align-items:center;min-width:0;overflow:hidden}
.offline{grid-column:3;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.offline span::before{content:"▲ ";color:var(--faint)}
.offline span.me{color:var(--c-sb);font-weight:600}
.offline span.me::before{color:var(--c-sb)}
.cell{flex:none;min-width:58px;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-family:var(--f-mono);font-size:11px;display:grid;place-items:center;color:var(--muted);position:relative}
.cell.mine{border-color:var(--c-kafka);color:var(--ink);background:color-mix(in srgb,var(--c-kafka) 14%,var(--panel));font-weight:600}
.cell.new{animation:drop .9s ease-out both;animation-delay:var(--d,0s);box-shadow:0 0 0 2px var(--c-kafka)}
@keyframes drop{from{transform:translateY(-26px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.cell.leo{border-style:dashed;color:var(--faint);min-width:44px}
.flag{position:absolute;bottom:1px;font-family:var(--f-mono);font-size:9.5px;white-space:nowrap;color:var(--c-sb);transform:translateX(-50%)}
.flag::before{content:"▲ "}
.grp{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);margin-bottom:8px;font-size:12.5px}
.grp.act{border-color:var(--c-sb);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-sb) 16%,transparent)}
.grp h6{margin:0 0 4px;font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.grp .mem{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:2px 4px;border-radius:4px}
.grp .mem.act{background:color-mix(in srgb,var(--c-sb) 14%,transparent);color:var(--ink);font-weight:600}
.grp .lag{font-family:var(--f-mono);font-size:11.5px;margin-top:4px}
.bytes{display:flex;gap:4px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px}
.bytes span{border:1px solid var(--line);border-radius:5px;padding:4px 7px;background:var(--panel)}
.bytes span.m{border-color:var(--c-kafka);color:var(--c-kafka)}
.bytes span.i{border-color:var(--c-pg);color:var(--c-pg)}
.mtable{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--f-mono)}
.mtable th{text-align:left;color:var(--muted);font-weight:500;font-family:var(--f-body);font-size:11.5px;border-bottom:1px solid var(--line);padding:4px 8px 4px 0;white-space:nowrap}
.mtable td{border-bottom:1px solid var(--grid);padding:4px 8px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.mtable tr.new td{background:color-mix(in srgb,var(--k,var(--accent)) 12%,transparent);animation:fadein .8s both;animation-delay:var(--d,0s)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.rules td,.rules th{font-size:13px;padding:7px 10px 7px 0;border-bottom:1px solid var(--grid);vertical-align:top}
.rules{width:100%;border-collapse:collapse}
.pass{color:var(--good);font-weight:700} .fail{color:var(--bad);font-weight:700}
.seq{display:flex;flex-direction:column;gap:0;font-size:13.5px}
.seqrow{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:8px;min-height:44px}
.seqrow .arr{height:2px;background:var(--k);position:relative;opacity:.3;transition:opacity .3s}
.seqrow .arr::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:8px solid var(--k);border-right:0}
.seqrow.back .arr::after{right:auto;left:-1px;border-left:6px solid transparent;border-right:8px solid var(--k)}
.seqrow .lab{font-family:var(--f-mono);font-size:12px;text-align:center;margin-top:-22px}
.seqrow.on .arr{opacity:1}
.ledger{display:flex;gap:4px;flex-wrap:wrap}
.ledger span{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--panel)}
.ledger span.new{border-color:var(--c-pg);background:color-mix(in srgb,var(--c-pg) 12%,var(--panel));animation:fadein .6s both;animation-delay:var(--d,0s)}
.ledger span.hwm{border-color:var(--c-pg);border-width:2px}
.bpmn{display:flex;flex-direction:column;gap:16px}
.blane{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:10px}
.blane h4{font-size:14px;width:200px;flex:none;color:var(--muted);font-weight:600}
.bn{border:1.5px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;background:var(--panel-2);display:flex;flex-direction:column;min-width:120px}
.bn small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.bn.ev{border-radius:999px;min-width:0;padding:7px 14px}
.bn.user{border-style:dashed}
.bn.done{border-color:color-mix(in srgb,var(--good) 65%,var(--line))}
.bn.cur{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);font-weight:600}
.barrow{width:22px;height:2px;background:var(--line);position:relative;flex:none}

    ["Market segment",`${usdM(sub.insured.revenue)} revenue`,sub.insured.revenue>MM_THRESHOLD,"revenue above $50M → Middle Market"]];
  if(sub.flow==="RN") rows.push(["Expiring policy reference",sub.expiring.policyNumber||"(missing)",!!sub.expiring.policyNumber,"required for a renewal"]);
  return {ok:rows.every(r=>r[2]),rows,processStatus:ps};
}
function scores(sub){
  const h=fnv(sub.insured.fein+sub.insured.domain), asm=420+(h%500), rsa=1+(Math.floor(h/7)%5);
  const pool=["RDP exposed on 1 host","TLS 1.0 enabled on mail gateway","DMARC policy = none","2 leaked credentials (2024 combo list)","End-of-life VPN appliance firmware","Lookalike domain registered","Patch cadence median 21 days","No exposed databases found"];
  const f1=[0,1,2,3,4,5,6].filter(i=>(h>>i)&1).map(i=>pool[i]).slice(0,4); if(!f1.length) f1.push(pool[7]);
  return {asm,asmGrade:grade(asm),rsa,asmFindings:f1,rsaFindings:[rsa>=4?"MFA enforced on email and remote access":"MFA gaps on privileged accounts",rsa>=3?"EDR on 100% of endpoints":"EDR coverage 70%","Incident response plan tested "+(rsa>=3?"within 12 months":"over 24 months ago")]};
}
function rate(sub,sc){
  const p=PRODUCTS[sub.product], rev=sub.insured.revenue/1e6, hz=HAZ_RATE[sub.insured.hazard], base=1500+hz*Math.pow(rev,0.85);
  const ilf=ILF[sub.limit]||1, ret=RET[sub.retention]||1, asmF=+(1.25-(sc.asm-300)/650*0.4).toFixed(3), rsaF=[1.10,1.05,1.0,0.95,0.90][sc.rsa-1], st=STATE_LOAD[sub.insured.address.state]||1;
  const lines=[["Exposure base",`${rev.toFixed(1)}M revenue^0.85 × ${hz} (${sub.insured.hazard}) + 1,500`,Math.round(base)],["Increased limit factor",`${usdM(sub.limit)} limit`,ilf],["Retention factor",`${usd(sub.retention)} retention`,ret],["Product factor",p.name,p.factor],["ASM score factor",`score ${sc.asm} (${sc.asmGrade})`,asmF],["RSA maturity factor",`maturity ${sc.rsa}/5`,rsaF],["State regulatory load",sub.insured.address.state,st]];
  const prem=Math.round(base*ilf*ret*p.factor*asmF*rsaF*st/10)*10, out={lines,premium:prem,fee:250,total:prem+250};
  if(sub.flow==="RN"&&sub.expiring.premium){out.expiringPremium=sub.expiring.premium;out.rateChange=+(((prem/sub.expiring.premium)-1)*100).toFixed(1);}
  return out;
}

    say:"Now the Intake Service produces the record to the topic pc dot submission dot received. The key is the submission ID. The partitioner hashes that key and takes it modulo six, because the topic has six partitions. That always gives the same partition for this submission, which is how Kafka keeps every event for one risk in order. The record goes to the partition's leader broker, the two follower brokers copy it, and only when all in-sync replicas have it does the leader acknowledge. The record now has a permanent offset.",
    deep:["<code>acks=all</code> + <code>min.insync.replicas=2</code>: the write survives losing a broker.","<code>enable.idempotence=true</code>: retries cannot create duplicates on the broker.","Offsets are per partition and never reused; consumers track their own position.","Retention on this topic is 30 days, so a new consumer can replay from offset 0."],

  add({from:"t_enriched",to:"rider",ch:"kafka",scene:"kafka",kmode:"consume",tid:"t_enriched",group:"cg-cyber-workbench",dup:race?4:1,title:race?"The workbench reads 4 copies and processes 1":"The workbench's Kafka rider consumes",ref:"§1.6, §2.4",

    apply:(w,c,i)=>{c.ids.risk=`WF-RISK-${w.ctr.risk++}`;return sbdetail(w,c,i,"StartRiskClearance",{riskId:c.ids.risk,submissionId:sub.submissionId,applicationId:c.ids.app,flow:nb?"NEW_BUSINESS":"RENEWAL",productCode:P.code,marketSegment:"MIDDLE_MARKET",priorPolicyNumber:sub.expiring?.policyNumber||null});}});
  add({from:"asb",to:"lm",ch:"sb",scene:"lm",title:"The Lifecycle Manager starts the parent risk workflow",ref:"§3.2, §3.3",
    say:"",sayFn:c=>`The Lifecycle Manager receives the command and starts the parent risk workflow ${spell(c.ids.risk)}, from the BPMN file ${nb?"cyber risk clearance":"cyber risk renewal"}, version 7. BPMN diagrams are stored as XML in the configuration folder, and every system task box in the diagram is the name of a C sharp class. One caution from the transcript: the workflow state is an untyped key-value bag, so a value like revenue is just a string until code checks it.`,
    deep:["Definitions live in <code>/config/lifecycle-manager/process/</code> (§3.3).","Untyped state means runtime type checks, and float maths caused pricing rounding errors (§1.2).","Service-locator lookups and mixed IoC scopes add GC pressure under load (§1.2)."],
    apply:(w,c,i)=>{c.status="CLEARANCE_IN_PROGRESS";c.bpmn={cur:"p_start",done:[]};return {kv:[["Workflow",c.ids.risk],["Definition",`${nb?"cyber-risk-clearance":"cyber-risk-renewal"}.bpmn v7`],["Consumer","StartRiskClearanceConsumer"]],payload:{flowState:{riskId:c.ids.risk,submissionId:sub.submissionId,applicationId:c.ids.app,"insured.name":I.name,"insured.state":I.address.state,"insured.naics":I.naics,"insured.revenue":String(I.revenue),"product.code":P.code,classOfBusiness:P.cob.code,segment:"MIDDLE_MARKET"}}};}});
  if(!nb){
    add({from:"lm",to:"pg",ch:"sql",scene:"pg",title:"Last year's workflow is loaded",ref:"§3.5",
      say:"Because this is a renewal, the engine loads last year's risk workflow. Its snapshot says it was created under BPMN version 6, but the current definition is version 7.",
      deep:["Long-running workflows outlive their diagram versions (§3.5)."],
      apply:(w,c,i)=>{c.ids.priorRisk=`WF-RISK-${8800-(fnv(sub.expiring.policyNumber)%300)}`;return {events:[],sql:`SELECT data, mt_version\n  FROM cyber.mt_doc_flow_snapshot_projection\n WHERE id = '${c.ids.priorRisk}';\n-- 1 row · definitionVersion = 6`,kv:[["Prior risk",c.ids.priorRisk],["Stored version","6"],["Latest version","7"]]};}});
    add({from:"lm",to:"lm",ch:"logic",scene:"lm",task:["t_upgrade"],title:"Self-healing upgrade from version 6 to 7",ref:"§3.5",
      say:"The engine upgrades the old instance on the fly. It transforms the stored state to match version 7, renaming nodes and adding new fields, before the renewal reads anything from it. The transcript calls this a self-healing upgrade on access.",
      deep:["Upgrade on read avoids a big-bang migration of every historical workflow."],
      apply:(w,c,i)=>({kv:[["Task","UpgradeFlowVersion : IHandleServiceTask"],["From → to","v6 → v7"]],payload:{priorRisk:c.ids.priorRisk,upgradedTo:7,carriedForward:{expiringPolicyNumber:sub.expiring.policyNumber,expiringPremium:sub.expiring.premium,expiringLimit:sub.expiring.limit,priorOptionIds:sub.expiring.optionIds}}})});
  }

  /* ---------- chapter 5 */
  chap=5;
  add({from:"t_scan",to:"rider",ch:"kafka",scene:"kafka",kmode:"consume",tid:"t_scan",group:"cg-cyber-workbench",title:"The workbench reads both scan results",ref:"§1.6",
    say:"The workbench's consumer group also subscribes to the scan topic. Both results, A S M first and then R S A, arrive from the same partition in order and are attached to the risk.",
    deep:["Ordering per key means the ASM result can never overtake an older one for the same submission."],
    apply:(w,c,i)=>{consume(w,"cg-cyber-workbench",c.rec.asm);const g=consume(w,"cg-cyber-workbench",c.rec.rsa);return {recs:[c.rec.asm,c.rec.rsa],...kdetail(c.rec.rsa,"consume",g)};}});
  add({from:"lm",to:"lm",ch:"logic",scene:"lm",task:["t_clear","t_app","t_score"],title:"System tasks: clearance, appetite and scoring",ref:"§3.1, §3.4",
    say:"",sayFn:c=>`Now three system tasks run back to back, with no human involved. Clearance Check looks for duplicates, screens sanctions and confirms the broker is licensed. Appetite Validation confirms a US risk, Middle Market revenue and a NAICS code in appetite. Scoring Algorithm combines the A S M score of ${c.sc.asm} and the R S A rating of ${c.sc.rsa}. Each task's events are held in memory. If any task failed, all of them would be thrown away together.`,
    deep:["Each class implements <code>IHandleServiceTask.Execute()</code> (§3.3).","Events are staged in memory; a failure anywhere rolls back the whole chain (§3.4)."],
    apply:(w,c,i)=>{c.bpmn={cur:"p_score",done:["p_start","p_clear","p_app"]};return {evalRows:[
      ["ClearanceCheck",`no open submission for FEIN ${I.fein}; sanctions clear; broker licensed (${sub.broker.licenseState})`,true,"duplicate · sanctions · licensing"],
      ["AppetiteValidation",`US · ${I.address.state} · NAICS ${I.naics} (${I.hazard}) · ${usdM(I.revenue)}`,true,"US, Middle Market, NAICS in appetite"],
      ["ScoringAlgorithm",`ASM ${c.sc.asm} (${c.sc.asmGrade}) · RSA ${c.sc.rsa}/5 → tier ${c.sc.asm>=750?"Preferred":c.sc.asm>=600?"Standard":"Refer"}`,true,"composite risk score"]],
      staged:["ClearanceCleared","AppetiteValidated","ScanResultsAttached","RiskScored"],kv:[["Staged events","4, in memory"]]};}});
  add({from:"lm",to:"pg",ch:"sql",scene:"pg",title:"The chain is committed to the event store",ref:"§3.4",
    say:"",sayFn:c=>`The chain succeeded, so everything is written in one PostgreSQL transaction. The events are appended to the m t events table, on the stream whose I D is the risk I D, ${spell(c.ids.risk)}. Because the chain completed, a Flow Snapshot event is added and the current-state document is updated. Events are never updated or deleted. The table is an append-only history of the risk.`,
    deep:["<code>mt_events</code>: one row per event with stream_id, version, type and JSON data.","Version numbers per stream give optimistic concurrency.","FlowSnapshot is appended only after the whole chain succeeds (§3.4)."],
    apply:(w,c,i)=>{const ev=appendEvents(w,c.ids.risk,["SubmissionReceived","ClearanceCleared","AppetiteValidated","ScanResultsAttached","RiskScored","FlowSnapshot"],c.ts(i),t=>evData(t,sub,c));c.status="AWAITING_RISK_DETAILS";snap(w,c,sub,i);c.bpmn={cur:"p_risk",done:["p_start","p_clear","p_app","p_score"]};return pgdetail(ev,c);}});
  proj("risk cleared","RiskUpdated");

  /* ---------- chapter 6 */
  chap=6;
  add({from:"browser",to:"api",ch:"http",scene:"http",task:["u_risk"],title:"The underwriter saves the Risk Details form",ref:"§1.1, §3.1",
    say:"The risk lands in the underwriter's queue. They open it and complete the Risk Details form: security controls, record counts, prior incidents. When they press save, the Web A P I answers 202 Accepted in about forty milliseconds. Pay attention to that. 202 means received, not valid. Validation happens later in the workflow, so if something is wrong, the error appears afterwards, sometimes on another screen.",
    deep:["This is a user task: it exposes a composite form, prefilled by form plugins (§3.3).","The async reply explains the confusing delayed errors in §1.1.","Under load, GC pauses can make the save feel unconfirmed (§1.2)."],
    apply:(w,c,i)=>({req:{method:"PUT",path:`/api/risks/${c.ids.risk}/tasks/complete-risk-details`,status:"202 Accepted",ms:41,async:true},kv:[["Method",`PUT /api/risks/${c.ids.risk}/tasks/complete-risk-details`],["Response","202 Accepted · 41 ms"]],payload:formAnswers(sub)})});
  add({from:"api",to:"asb",ch:"sb",scene:"sb",title:"A CompleteUserTask command is queued",ref:"§1.1",
    say:"The controller wraps the form in a Complete User Task command and sends it to the same Service Bus queue, on the same session as every other command for this risk.",
    deep:["Same session = processed after any earlier command for this risk."],
    apply:(w,c,i)=>sbdetail(w,c,i,"CompleteUserTask",{riskId:c.ids.risk,taskId:"complete-risk-details",formId:"cyber-mm-risk-details",formVersion:3})});
  add({from:"asb",to:"lm",ch:"sb",scene:"lm",task:["u_risk"],title:"Form plugins apply the answers",ref:"§3.3",
    say:"The Lifecycle Manager completes the user task. Form plugins validate the answers and merge them into the workflow state, and the parent workflow moves on to its next node: spawning a quote.",
    deep:["Validation failures here are what surface late in the UI."],
    apply:(w,c,i)=>{c.bpmn={cur:"p_spawn",done:["p_start","p_clear","p_app","p_score","p_risk"]};return {kv:[["Task","Complete Risk Details (user task)"],["Validation","passed"],["Next node","Spawn quote"]]};}});
  add({from:"lm",to:"pg",ch:"sql",scene:"pg",title:"RiskFormSaved is appended",ref:"§3.4",
    say:"The saved form becomes another event on the risk's stream.",deep:["Every change is an event: the stream is a full audit trail."],
    apply:(w,c,i)=>pgdetail(appendEvents(w,c.ids.risk,["RiskFormSaved"],c.ts(i),t=>evData(t,sub,c)),c)});
  add({from:"lm",to:"t_form",ch:"kafka",scene:"kafka",kmode:"produce",tid:"t_form",title:"RiskFormUpdated is published for analytics",ref:"§2.3",
    say:"Every form save also publishes a detailed domain event to pc dot risk dot form dot updated, with the answer groups, the risk metadata and the status. This time the key is the risk I D. This topic exists mainly for analytics.",
    deep:["Answers travel as key-value groups; analytics rebuilds 400+ typed attributes from them (§2.3).","Long retention (365 days) supports reprocessing by the data team."],
    apply:(w,c,i)=>{const v={riskId:c.ids.risk,submissionId:sub.submissionId,formId:"cyber-mm-risk-details",formVersion:3,answerGroups:formAnswers(sub).answerGroups,status:c.status,savedBy:"uw.jlee",savedAt:c.ts(i)};c.rec.form=produce(w,"t_form",c.ids.risk,v,"cyber-api",c.ts(i));return {recs:[c.rec.form],...kdetail(c.rec.form,"produce")};}});
  add({from:"t_form",to:"connect",ch:"kafka",scene:"kafka",kmode:"consume",tid:"t_form",group:"connect-snowflake-sink-cyber",title:"Kafka Connect reads the form event",ref:"§2.3",
    say:"Kafka Connect runs a managed Snowflake sink connector. Under the hood it is just another consumer group, connect snowflake sink cyber, with two tasks sharing the partitions.",
    deep:["Connector tasks are consumer-group members; tasks.max = 2."],
    apply:(w,c,i)=>{const g=consume(w,"connect-snowflake-sink-cyber",c.rec.form);return {recs:[c.rec.form],...kdetail(c.rec.form,"consume",g)};}});
  add({from:"connect",to:"snow",ch:"connect",scene:"connect",title:"The form event lands in Snowflake",ref:"§2.3",
    say:"The connector streams the record into the Snowflake table RISK FORM EVENTS. The Kafka metadata goes in one column and the full record in another. Data teams then flatten it into hundreds of typed columns, and can query across policies, submissions and industry benchmarks without touching the operational databases.",
    deep:["RECORD_METADATA holds topic, partition, offset, key and timestamp.","RECORD_CONTENT holds the Avro record as VARIANT JSON."],
    apply:(w,c,i)=>{const row={RECORD_METADATA:{topic:c.rec.form.topic,partition:c.rec.form.partition,offset:c.rec.form.offset,key:c.rec.form.key,CreateTime:c.ts(i)},RECORD_CONTENT:c.rec.form.value};w.snow.RISK_FORM_EVENTS.push(row);return {row,table:"CYBER_DW.RAW.RISK_FORM_EVENTS",kv:[["Table","CYBER_DW.RAW.RISK_FORM_EVENTS"],["Ingest","Snowpipe Streaming"]],payload:row};}});

  /* ---------- chapter 7 */
  chap=7;
  add({from:"lm",to:"lm",ch:"logic",scene:"lm",task:["t_rate"],title:"A child quote workflow is spawned and rated",ref:"§3.2",
    say:"",sayFn:c=>`The parent risk workflow now spawns a child quote workflow, ${spell(c.ids.quote)}, with an explicit link back to its parent. Its first system task is the Rating Engine. It starts from an exposure base built on revenue and hazard group, then applies factors for limit, retention, product, the A S M score, the R S A rating and the state. The annual premium comes to ${usdWords(c.rt.premium)}.${c.rt.rateChange!=null?` Against last year's ${usdWords(c.rt.expiringPremium)}, that's a ${Math.abs(c.rt.rateChange)} percent ${c.rt.rateChange>=0?"increase":"decrease"}.`:""} The parent learns about the child's changes through the I Handle Change Made To Child interface.`,
    deep:["Parent and child sync through IHandleChangeMadeToParent and IHandleChangeMadeToChild (§3.2).","The rating formula here is illustrative, built for teaching."],
    apply:(w,c,i)=>{c.ids.quote=`WF-QUOTE-${w.ctr.quote++}`;c.rt=rate(sub,c.sc);c.status="QUOTE_RATED";c.bpmn={cur:"c_review",done:["p_start","p_clear","p_app","p_score","p_risk","p_spawn","c_start","c_rate"]};
      return {kv:[["Child workflow",c.ids.quote],["Parent link",c.ids.risk],["Definition",P.bpmnQuote+" v4"]],rating:c.rt};}});
  add({from:"lm",to:"pg",ch:"sql",scene:"pg",title:"Quote events are committed",ref:"§3.4",
    say:"The quote's events go onto the child's own stream, and the parent's stream records the link. Both are written in the same transaction, with a new flow snapshot.",
    deep:["Two streams, one transaction: parent and child never disagree."],
    apply:(w,c,i)=>{const e1=appendEvents(w,c.ids.quote,["QuoteWorkflowStarted","QuoteRated","FlowSnapshot"],c.ts(i),t=>evData(t,sub,c));const e2=appendEvents(w,c.ids.risk,["ChildQuoteLinked"],c.ts(i),t=>evData(t,sub,c));snap(w,c,sub,i);return pgdetail(e1.concat(e2),c);}});
  proj("quote rated","QuoteUpdated");

  /* ---------- chapter 8 */
  chap=8;
  add({from:"browser",to:"api",ch:"http",scene:"http",task:["u_quote"],title:"The underwriter issues the quote",ref:"§3.1",
    say:"The underwriter reviews the rating worksheet and presses Issue Quote. Again the A P I accepts the command straight away and the work happens asynchronously.",
    deep:["Review & Issue Quote is a user task on the child workflow."],
    apply:(w,c,i)=>({req:{method:"POST",path:`/api/quotes/${c.ids.quote}/issue`,status:"202 Accepted",ms:37,async:true},kv:[["Method",`POST /api/quotes/${c.ids.quote}/issue`],["Response","202 Accepted · 37 ms"]],payload:{quoteId:c.ids.quote,limit:sub.limit,retention:sub.retention,premium:c.rt.premium,subjectivities:["Signed application within 30 days","Confirmation of MFA on remote access"]}})});
  add({from:"api",to:"asb",ch:"sb",scene:"sb",title:"An IssueQuote command is queued",ref:"§1.1",say:"The Issue Quote command joins the risk's session on Service Bus.",deep:["Same queue, same session, strict order."],
    apply:(w,c,i)=>sbdetail(w,c,i,"IssueQuote",{riskId:c.ids.risk,quoteId:c.ids.quote})});
  add({from:"asb",to:"lm",ch:"sb",scene:"lm",task:["u_quote"],title:"The child issues the quote and tells the parent",ref:"§3.2",
    say:"",sayFn:c=>`The child workflow moves to Quote Issued and gets quote number ${spell(c.ids.quoteNo)}. The parent's change handler hears about it and moves the risk to Quoted.`,
    deep:["Bi-directional handlers keep parent status in step with child status."],
    apply:(w,c,i)=>{c.ids.quoteNo=`Q-CY-2026-${pad(w.ctr.quoteNo++ +5120,6)}`;c.status="QUOTED";c.bpmn={cur:"p_bindreq",done:["p_start","p_clear","p_app","p_score","p_risk","p_spawn","c_start","c_rate","c_review","c_issued"]};return {kv:[["Quote number",c.ids.quoteNo],["Valid until",addDays(c.ts(i).slice(0,10),30)],["Parent status","QUOTED"]]};}});
  add({from:"lm",to:"pg",ch:"sql",scene:"pg",title:"QuoteIssued is committed",ref:"§3.4",say:"Quote Issued and Risk Quoted are appended to the two streams in one transaction.",deep:["Append-only history."],
    apply:(w,c,i)=>{const ev=appendEvents(w,c.ids.quote,["QuoteIssued"],c.ts(i),t=>evData(t,sub,c)).concat(appendEvents(w,c.ids.risk,["RiskQuoted"],c.ts(i),t=>evData(t,sub,c)));snap(w,c,sub,i);return pgdetail(ev,c);}});
  add({from:"lm",to:"t_quote",ch:"kafka",scene:"kafka",kmode:"produce",tid:"t_quote",title:"QuoteIssued is published",ref:"§1.6",
    say:"The issued quote becomes a cross-domain event on pc dot quote dot issued, keyed by risk I D. Nothing in this lab consumes it yet, but because Kafka keeps it, any domain that subscribes later, such as document generation or broker notifications, can read it from the beginning.",
    deep:["A topic with no consumers is still useful: future consumers replay from offset 0."],
    apply:(w,c,i)=>{const v={quoteId:c.ids.quote,quoteNumber:c.ids.quoteNo,riskId:c.ids.risk,submissionId:sub.submissionId,applicationId:c.ids.app,productCode:P.code,limitUsd:sub.limit,retentionUsd:sub.retention,premium:c.rt.premium.toFixed(2),feesUsd:c.rt.fee.toFixed(2),validUntil:addDays(c.ts(i).slice(0,10),30),issuedAt:c.ts(i)};c.rec.quote=produce(w,"t_quote",c.ids.risk,v,"cyber-api",c.ts(i));return {recs:[c.rec.quote],...kdetail(c.rec.quote,"produce")};}});
  proj("quote issued","QuoteIssued");

  /* ---------- chapter 9 */
  chap=9;
  add({from:"browser",to:"api",ch:"http",scene:"http",task:["u_bind"],title:"The underwriter requests bind",ref:"§3.1",
    say:"The broker accepts the quote, outside this lab, and the underwriter presses Bind.",deep:["Request Bind is a user task on the parent workflow."],
    apply:(w,c,i)=>({req:{method:"POST",path:`/api/risks/${c.ids.risk}/bind`,status:"202 Accepted",ms:44,async:true},kv:[["Method",`POST /api/risks/${c.ids.risk}/bind`],["Response","202 Accepted · 44 ms"]],payload:{quoteId:c.ids.quote,quoteNumber:c.ids.quoteNo,effectiveDate:sub.effective,paymentPlan:"Annual",billing:"Agency bill"}})});
  add({from:"api",to:"asb",ch:"sb",scene:"sb",title:"A BindPolicy command is queued",ref:"§1.1",say:"The Bind Policy command goes onto the risk's session.",deep:["Ordered after every earlier command for this risk."],
    apply:(w,c,i)=>sbdetail(w,c,i,"BindPolicy",{riskId:c.ids.risk,quoteId:c.ids.quote})});
  add({from:"asb",to:"lm",ch:"sb",scene:"lm",task:["u_bind","t_bind"],title:"The BindPolicy system task runs",ref:"§3.1, §3.2",
    say:"",sayFn:c=>`The Bind Policy system task checks the subjectivities and the underwriter's authority, then assigns policy number ${spell(c.ids.policy)}. Both workflows close. The child reports to the parent, and the parent tells any remaining children, through the two change-handler interfaces.`,
    deep:["Authority and subjectivities are checked before the policy number is assigned."],
    apply:(w,c,i)=>{c.ids.policy=`CYB-MM-2026-${pad(w.ctr.policy++ +7400,6)}`;c.status="BOUND";c.bpmn={cur:"p_end",done:["p_start","p_clear","p_app","p_score","p_risk","p_spawn","p_bindreq","p_bind","c_start","c_rate","c_review","c_issued","c_end"]};
      return {kv:[["Policy number",c.ids.policy],["Transaction",nb?"New business":"Renewal of "+sub.expiring.policyNumber],["Term",`${sub.effective} → ${sub.expiration}`]]};}});
  add({from:"lm",to:"pg",ch:"sql",scene:"pg",title:"PolicyBound and the final snapshots are committed",ref:"§3.4",say:"The final events close both streams in one transaction.",deep:["The stream now holds the complete life of the risk."],
    apply:(w,c,i)=>{const ev=appendEvents(w,c.ids.quote,["QuoteBound","FlowSnapshot"],c.ts(i),t=>evData(t,sub,c)).concat(appendEvents(w,c.ids.risk,["PolicyBound","FlowSnapshot"],c.ts(i),t=>evData(t,sub,c)));snap(w,c,sub,i);return pgdetail(ev,c);}});
  add({from:"lm",to:"t_bound",ch:"kafka",scene:"kafka",kmode:"produce",tid:"t_bound",title:"PolicyBound is published to Kafka",ref:"§1.6",
    say:"This is the hand-off to the rest of the company. The workbench publishes Policy Bound to pc dot policy dot bound. It carries everything a downstream system needs: insured, address and state, NAICS code, broker, product, class of business, term, limit, retention and premium. This topic keeps its data indefinitely for compliance.",
    deep:["Schema v7 of PolicyBound; consumers on v6 still work under BACKWARD compatibility.","Two groups read it in this lab: the PAS and the Snowflake sink."],
    apply:(w,c,i)=>{c.rec.bound=produce(w,"t_bound",c.ids.risk,boundValue(sub,c,i),"cyber-api",c.ts(i));return {recs:[c.rec.bound],...kdetail(c.rec.bound,"produce")};}});
  add({from:"t_bound",to:"pas",ch:"kafka",scene:"kafka",kmode:"consume",tid:"t_bound",group:"cg-pas-policy-issuance",title:"The Policy Admin System consumes it",ref:"brief",
    say:"The policy administration system issues the policy from this event. It's out of scope for the lab, but its consumer group and offsets are real. If it were rebuilt tomorrow, it could start at offset zero and replay every bound policy.",
    deep:["Replay from offset 0 is possible because retention is infinite on this topic."],
    apply:(w,c,i)=>{const g=consume(w,"cg-pas-policy-issuance",c.rec.bound);return {recs:[c.rec.bound],...kdetail(c.rec.bound,"consume",g)};}});
  add({from:"t_bound",to:"connect",ch:"kafka",scene:"kafka",kmode:"consume",tid:"t_bound",group:"connect-snowflake-sink-cyber",title:"Kafka Connect reads PolicyBound",ref:"§2.3",
    say:"The same Snowflake sink connector also subscribes to the bound-policy topic. Two independent consumer groups, the PAS and Kafka Connect, have now read the same record.",deep:["One write, two independent readers."],
    apply:(w,c,i)=>{const g=consume(w,"connect-snowflake-sink-cyber",c.rec.bound);return {recs:[c.rec.bound],...kdetail(c.rec.bound,"consume",g)};}});
  add({from:"connect",to:"snow",ch:"connect",scene:"connect",title:"The bound policy lands in Snowflake",ref:"§2.3",
    say:"The bound policy lands in the POLICY BOUND table, where analysts can join it to the submission, the form answers and industry benchmarks.",deep:["Cross-domain analytics without load on operational systems."],
    apply:(w,c,i)=>{const row={RECORD_METADATA:{topic:c.rec.bound.topic,partition:c.rec.bound.partition,offset:c.rec.bound.offset,key:c.rec.bound.key},RECORD_CONTENT:c.rec.bound.value};w.snow.POLICY_BOUND.push(row);return {row,table:"CYBER_DW.RAW.POLICY_BOUND",kv:[["Table","CYBER_DW.RAW.POLICY_BOUND"]],payload:row};}});
  proj("bound","PolicyBound");
  const last=S[S.length-1]; last.say+=" And that completes the journey, from the broker's submission to a bound policy published for the rest of the business.";
  return S;
}
const stateName=c=>(STATES.find(s=>s[0]===c)||[c,c])[1];

/* payload builders */
function acord(sub){const P=PRODUCTS[sub.product];return {submissionId:sub.submissionId,transaction:sub.flow==="NB"?"NEW_BUSINESS":"RENEWAL",lineOfBusiness:"CYBER",product:{code:P.code,name:P.name},classOfBusiness:P.cob,
  insured:{name:sub.insured.name,fein:sub.insured.fein,address:sub.insured.address,naics:{code:sub.insured.naics,title:sub.insured.naicsTitle},sic:sub.insured.sic,annualRevenueUsd:sub.insured.revenue,employees:sub.insured.emps,yearsInBusiness:sub.insured.yib,primaryDomain:sub.insured.domain,sensitiveRecords:sub.insured.records},
  producer:{firm:sub.broker.firm,producerCode:sub.broker.producerCode,npn:sub.broker.npn,contact:sub.broker.contact,email:sub.broker.email,licenseState:sub.broker.licenseState,office:sub.broker.city},
  requested:{effectiveDate:sub.effective,expirationDate:sub.expiration,limitUsd:sub.limit,retentionUsd:sub.retention},expiringPolicy:sub.expiring||null};}
const insuredAvro=sub=>({name:sub.insured.name,fein:sub.insured.fein,address:{street:sub.insured.address.street,city:sub.insured.address.city,state:sub.insured.address.state,postalCode:sub.insured.address.zip,country:"US"},naicsCode:sub.insured.naics,naicsTitle:sub.insured.naicsTitle,sicCode:sub.insured.sic,annualRevenueUsd:sub.insured.revenue,employeeCount:sub.insured.emps,primaryDomain:sub.insured.domain,sensitiveRecordCount:sub.insured.records});

function estimateMs(text){const words=text.split(/\s+/).length;return Math.max(4000,words*370/speechRate);}
function stopSpeech(){speakTok++;if(synth)synth.cancel();$("#live").classList.remove("on");clearTimeout(autoTimer);}
function narrate(text,done){
  stopSpeech(); const tok=speakTok; const ss=sentencesOf(text); renderCaption(text,-1);
  const finish=()=>{if(tok!==speakTok)return;$("#live").classList.remove("on");renderCaption(text,ss.length);done&&done();};
  if(!voiceOn||!synth){ // timed captions
    let k=0;const per=estimateMs(text)/ss.length;const tick=()=>{if(tok!==speakTok)return;if(k>=ss.length){finish();return;}renderCaption(text,k++);autoTimer=setTimeout(tick,per);};tick();return;}
  $("#live").classList.add("on");
  const v=voices.find(v=>v.name===$("#voiceSel").value);
  let watchdog=setTimeout(finish,estimateMs(text)*1.8+4000);
  ss.forEach((s,k)=>{const u=new SpeechSynthesisUtterance(s);if(v)u.voice=v;u.rate=speechRate;u.lang=v?.lang||"en-US";
    u.onstart=()=>{if(tok===speakTok)renderCaption(text,k);};
    if(k===ss.length-1){u.onend=()=>{clearTimeout(watchdog);finish();};u.onerror=()=>{clearTimeout(watchdog);finish();};}
    synth.speak(u);});
}

function kafkaScene(s,d,c){
  const t=TOPIC_BY_ID[s.tid], st=world.topics[s.tid], recs=d.recs||[], r=recs.at(-1), p=r.partition, prod=s.kmode==="produce";

   ["topics","Kafka topic catalogue",t(["Topic","Key","Partitions / RF","Retention","Value schema","Producers","Consumer groups"],TOPICS.map(tp=>[tp.name,tp.key,"6 / 3",tp.retention,`${tp.schema.subject} · id ${tp.schema.id} · v${tp.schema.version}`,tp.producers.join(", "),SUBSCRIBERS[tp.id].map(s=>`${s.g} (${s.members})`).join(", ")||"none in this lab"]))],
   ["producer","Kafka producer settings",`<p>Every producer in the platform uses the same safe defaults. Ordering per key holds because idempotence allows up to 5 in-flight requests without reordering.</p>${t(["Setting","Value","Why"],[["acks","all","the leader waits for every in-sync replica"],["enable.idempotence","true","broker discards retried duplicates"],["max.in.flight.requests.per.connection","5","safe with idempotence"],["linger.ms / batch.size","5 / 32768","small batches, low latency"],["compression.type","lz4","fast, cheap compression"],["key.serializer","StringSerializer","submission or risk ID as UTF-8"],["value.serializer","KafkaAvroSerializer","5-byte header + Avro body"],["partitioner","murmur2(key) mod partitions","same key → same partition"]])}`],

function loadSample(i){const s=SAMPLES[i];$("#insName").value=s.name;$("#fein").value=s.fein;$("#domain").value=s.domain;$("#street").value=s.street;$("#city").value=s.city;$("#state").value=s.state;$("#zip").value=s.zip;$("#yib").value=s.yib;$("#naics").value=s.naics;$("#revenue").value=s.revenue;$("#emps").value=s.emps;$("#records").value=s.records;$("#broker").value=s.broker;$("#product").value=s.product;setLimits();$("#limit").value=s.limit;$("#retention").value=s.ret;
  const h=fnv(s.fein);$("#expPol").value=`CYB-MM-2025-${pad(5000+h%2000,6)}`;$("#expPrem").value=Math.round((20000+h%90000)/100)*100;$("#expLimit").value=s.limit;$("#expOpts").value=`OPT-${71000+h%900}, OPT-${71000+h%900+1}`;updateDerived();}
function randomize(){
  const r=a=>a[Math.floor(Math.random()*a.length)];
  const names=["Harbor","Meridian","Keystone","Lakeshore","Ironwood","Bluefield","Crescent","Pinnacle","Redstone","Westbrook"],kinds=[["Health System","622110"],["Savings Bank","522110"],["Data Centers LLC","518210"],["Aerospace Co.","336411"],["University","611310"],["Power Cooperative","221122"],["Software, Inc.","541511"],["Logistics Corp.","488510"]];
  const k=r(kinds),nm=`${r(names)} ${k[0]}`;$("#insName").value=nm;$("#naics").value=k[1];$("#state").value=r(STATES)[0];$("#fein").value=`${pad(10+Math.floor(Math.random()*89),2)}-${pad(Math.floor(Math.random()*9999999),7)}`;
  $("#domain").value=nm.toLowerCase().replace(/[^a-z]+/g,"")+".example";$("#street").value=`${100+Math.floor(Math.random()*8900)} Commerce Way`;$("#city").value="Springfield";$("#zip").value=pad(Math.floor(Math.random()*99999),5);
  $("#revenue").value=(55+Math.floor(Math.random()*900))*1e6;$("#emps").value=200+Math.floor(Math.random()*5000);$("#records").value=(10+Math.floor(Math.random()*900))*1000;$("#yib").value=5+Math.floor(Math.random()*80);$("#broker").value=r(BROKERS).id;updateDerived();}
function createFromForm(){const s=readForm();s.submissionId=`SUB-2026-${pad(subSeq++,6)}`;s.createdAt=new Date().toISOString();s.status=eligibility(s).ok?"NEW":"IGNORED";subs.unshift(s);startRun(s);return s;}

function init(){
  fillSelect("#sample",SAMPLES.map((s,i)=>[i,s.label]));
  fillSelect("#product",Object.values(PRODUCTS).map(p=>[p.code,`${p.name} · company ${p.companyCode} · ${p.cob.code}`]));
  fillSelect("#retention",Object.keys(RET).map(r=>[r,usd(+r)]));
  fillSelect("#expLimit",[1e6,2e6,3e6,5e6,10e6].map(l=>[l,usdM(l)]));
  fillSelect("#state",STATES.map(([c,n])=>[c,`${c} · ${n}`]));
  fillSelect("#naics",NAICS.map(n=>[n[0],`${n[0]} · ${n[1]}`]));
  fillSelect("#broker",BROKERS.map(b=>[b.id,`${b.firm} · ${b.city}`]));
  setLimits();loadSample(0);setFlow("NB");
  $("#sample").onchange=e=>loadSample(+e.target.value);
  $("#flowNB").onclick=()=>setFlow("NB");$("#flowRN").onclick=()=>setFlow("RN");
  $("#product").onchange=()=>{setLimits();updateDerived();};
  ["#naics","#broker","#revenue"].forEach(id=>$(id).addEventListener("input",updateDerived));
  $("#randBtn").onclick=randomize;
  $("#subForm").addEventListener("submit",e=>{e.preventDefault();createFromForm();setView("lab");});
  document.querySelectorAll("#views button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $("#chapters").addEventListener("click",e=>{const b=e.target.closest("[data-jump]");if(b)userJump(+b.dataset.jump);});
  $("#bNext").onclick=()=>{if(run)userJump(run.idx+1);};
  $("#bPrev").onclick=()=>{if(run)userJump(run.idx-1);};
  $("#bReplay").onclick=()=>{if(run)userJump(run.idx);};
  $("#bPlay").onclick=()=>playing?stopPlay():play();
  $("#bVoice").onclick=()=>{voiceOn=!voiceOn;$("#bVoice").setAttribute("aria-pressed",voiceOn);$("#bVoice").classList.toggle("on",voiceOn);$("#bVoice").textContent=voiceOn?"🔊 Narration on":"🔇 Narration off (captions only)";if(!voiceOn&&synth)synth.cancel();};
  if(!synth){voiceOn=false;$("#bVoice").textContent="Captions only (no speech in this browser)";$("#bVoice").disabled=true;}
  $("#rate").oninput=e=>{speechRate=+e.target.value;$("#rateV").textContent=speechRate.toFixed(2)+"×";};
  $("#minimap").onclick=()=>setView("arch");
  const themes=["system","light","dark"];let ti=0;try{ti=Math.max(0,themes.indexOf(localStorage.getItem("lab-theme")||"system"));}catch(e){}
  const applyTheme=()=>{const tt=themes[ti];if(tt==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",tt);$("#themeBtn").textContent="Theme: "+tt;try{localStorage.setItem("lab-theme",tt);}catch(e){}};
  $("#themeBtn").onclick=()=>{ti=(ti+1)%3;applyTheme();};applyTheme();
  document.addEventListener("keydown",e=>{if(currentView!=="lab"||e.target.closest("input,select,textarea"))return;if(e.key==="ArrowRight"&&run){userJump(run.idx+1);}else if(e.key==="ArrowLeft"&&run){userJump(run.idx-1);}});
  drawMap($("#archMini"),"m-",false); drawMap($("#archFull"),"f-",true); renderGuide();
  createFromForm(); // open in a working state with the first sample
}
init();
</script>
